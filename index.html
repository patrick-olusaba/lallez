<!DOCTYPE html>
<html lang="en-US" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <title>ARRAD R</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Director / Writer" />

    <!-- Open Graph -->
    <meta property="og:title" content="ARRAD R" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arradr.com" />
    <meta property="og:description" content="Director / Writer" />
    <meta property="og:site_name" content="ARRAD R" />

    <!-- Schema.org -->
    <script type="application/ld+json">
      {"@context":"http://schema.org","@type":"WebPage","headline":"Director / Writer","url":"https://arradr.com"}
    </script>

    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#000000" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body class="not-mobile">
    <!-- Preloader — visible until React mounts -->
    <div id="preloader">
      <div class="preloader-inner">
        <img class="preloader-logo" src="/white-logo.png" alt="MADE BY LALLEZ" />
        <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
      </div>
    </div>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-inner {
        text-align: center;
      }
      .preloader-logo {
        display: block;
        width: 260px;
        margin: 0 auto 28px auto;
      }
      .preloader-bar {
        width: 200px;
        height: 2px;
        background: rgba(255,255,255,0.12);
        margin: 0 auto;
        overflow: hidden;
      }
      .preloader-bar-fill {
        width: 100%;
        height: 100%;
        background: #C0081F;
        animation: preloader-slide 1.4s ease infinite;
      }
      @keyframes preloader-slide {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <div id="container">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
